<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="main-container" class="container">
      <div>
        <div class="col-md-6">
          <h1 class="display-5 d-inline-block mt-5">Backoffice</h1>
          <h3 id="subtitle" class="d-inline-block"></h3>
          <form id="backoffice-form">
            <div class="mb-3">
              <label for="name" class="form-label">Nome Prodotto</label>
              <input type="text" class="form-control" id="name" aria-describedby="name" placeholder="Nome Prodotto" required />
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Descrizione</label>
              <textarea class="form-control" id="description" rows="3" placeholder="Scrivi una breve descrizione" required></textarea>
            </div>
            <div class="mb-3">
              <label for="imageUrl" class="form-label">URL Immagine</label>
              <input type="url" class="form-control" id="imageUrl" aria-describedby="imageUrl" placeholder="Inserisci URL immagine" required />
            </div>
            <div class="mb-3">
              <label for="brand" class="form-label">Brand</label>
              <input type="text" class="form-control" id="brand" aria-describedby="brand" placeholder="Brand Produttore" required />
            </div>

            <div class="mb-3">
              <label for="price" class="form-label">Prezzo</label>
              <input type="number" class="form-control" id="price" aria-describedby="price" required />
            </div>

            <button type="submit" class="btn btn-success">Salva</button>
            <button id="delete-btn" type="button" class="btn btn-danger"><i class="bi bi-trash3"></i>Elimina</button>
            <button id="reset-btn" type="button" class="btn btn-secondary">Reset</button>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script src="./backoffice.js"></script>
  </body>
</html>
